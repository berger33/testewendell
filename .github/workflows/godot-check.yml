name: Godot project check

on:
  push:
  pull_request:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.5.2
        run: |
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Import project
        run: ./Godot_v4.5.2-stable_linux.x86_64 --headless --path game --editor --quit
